<!DOCTYPE html>
<html>
    <head>
        <title>lesson-7 practice</title>
        <style>
            .thumbnail{
                width:200px;
                border-radius:15px;
                margin-bottom: 12px;
            }
        </style>
        <style>
            .tree{
                width:200px;
                height:200px;
                object-fit:cover;
                aspect-ratio: 1/1;
            }
        </style>
        <style>
            .river{
                height:200px;
                width:200px;
                object-fit:cover;
                border-radius: 200px;
                margin-bottom: 12px;;
                

            }
        </style>
        <style>
            .searchbox{
                padding-left:12px;
                padding-top:8px;
                padding-bottom:8px;
                /*font-family: Arial;*/
                border-radius: 5px;
                border-color: rgb(222, 212, 212);
                border-style:solid;
                box-shadow: 5px 5px 5px gray;
            }
        </style>
        <style>
            .googlesearch{
                 padding-left:12px;
                padding-top:8px;
                padding-bottom:8px;
                width:300px;
                border-radius: 5px;
                border-color: rgb(222, 212, 212);
                border-style:solid;
                font-family: Arial;
                margin-left:10px;
                margin-top:10px;
                font-weight: bold;
                border-radius:20px;
                box-shadow:2px 2px 2px gray;

            }
        </style>
        <style>
            .linkedln{
                width:200px;
            }
        </style>
        <style>
            .agree{
                padding-left:60px;
                padding-top:8px;
                padding-bottom:8px;
                padding-right:60px;
                border-radius:16px;
                border-style:solid;
                background-color:rgb(15, 117, 211);
                border:none; 
                color:white;
                margin-bottom:20px;

            }
        </style>
        <style>
            .twittertextbox{
                width:50px;
                height:50px;
                border-radius:25px;
                /*float:left;*/
                padding-right:5px;
                vertical-align: middle;
                object-fit:cover;


            }
        </style>
        <style>
            .tweet-input{
                border:none;
                outline:none;
                font-size:16px;
                vertical-align:middle;
                width:250px;
                border-color:white;

            }
        </style>
        <style>
            .Tweet-button{
                display:inline-block;
                background-color:rgb(29,155,240);        
                color:white;
                border:none;
                border-radius: 18px;
                font-weight:bold;
                font-size:15px;
                margin-left: 8px;
                cursor:pointer;
                padding-left:16px;
                padding-right:16px;
                padding-top:10px;
                padding-bottom:10px;
                transition:box-shadow 0.15s;
                vertical-align: middle;

            }

            

        </style>
    </head>
    <body>
        <img class="thumbnail" src="thumbnail-5.webp">
        <img class="tree" src="tree.webp" >
        <img class="river" src="river.webp">
        <input class="searchbox" type="text" placeholder="Search">
        <input class="googlesearch" type="text" placeholder="Search Google or type a URL">
        <p>Email</p>
        <input class="linkedln" type="text">
        <p>By clicking Agree & join,yo agree to the Privacy Policy </p>
        <button class="agree">Agree & Join</button>
        <br>
        <img class="twittertextbox" src="thumbnail-5.webp">
        <input class="tweet-input" type="text" placeholder="What's happening?">
        <button class="Tweet-button">Tweet</button>



    </body>
</html>

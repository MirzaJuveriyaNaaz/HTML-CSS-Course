<!DOCTYPE html>
<html>
<head>
  <title>buttons</title>
  <style>
    .subscribe-button{
      background-color:rgb(200, 0,0);
      color:white;
      border:none;
      padding-left:16px;
      padding-right:16px;
      padding-top:10px;
      padding-bottom:10px;
      border-radius:2px;
      cursor:pointer;
      transition:opacity 0.15s;
      margin-right:8px;
      vertical-align:top;
      
    }
  .subscribe-button:hover{
    opacity:0.7;

  }
  .subscribe-button:active{
    opacity:0.5;
  }
    .Join-button{
      background-color:white;
      color:rgb(6,95,212);
      border:1px solid rgb(41,118,211);
      padding-left:15px;
      padding-right:15px;
      padding-top:9px;
      padding-bottom:9px;
      cursor:pointer;
      margin-right:8px;
      transition:background-color 0.15s, color 0.15s;
      vertical-align:top;
      
    
    }
    .Join-button:hover{
      color:white;
      background-color:rgb(41,118,211);
      
    }
    .Join-button:active{
      opacity:0.7;
    }
    .tweet-button{
      background-color:rgb(29,155,240);
      border:none;
      color:white;
      padding-left:16px;
      padding-right:16px;
      padding-top:9px;
      padding-bottom:9px;
      border-radius:18px;
      font-weight:bold;
      font-size:15px;
      transition:box-shadow 0.15s;
      vertical-align: top;
    }
    .tweet-button:hover{
      box-shadow:2px 5px 8px rgba(0,0,0,0.15);
    }

  </style>
</head>
<body>
  <button class="subscribe-button">
    SUBSCRIBE 
  </button>
  <button class="Join-button">
    JOIN
  </button>
  <button class="tweet-button">
    Tweet
  </button>
  
  
</body>
</html>

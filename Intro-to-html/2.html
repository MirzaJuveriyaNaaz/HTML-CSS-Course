<!DOCTYPE html>
<html>
    <head>
        <title>lesson-2 exercise</title>
        <style>
            .uber{
                background-color:black;
                color:white;
                padding-top:10px;
                padding-bottom:10px;
                padding-right:15px;
                padding-left:15px;
                font-family:Arial;
                cursor:pointer;
                margin-right:15px;
                margin-top:5px;
                border-style:solid;
                

            }
        .uber:hover{
            opacity: 0.7;
        }



        </style>

            }

            }
        </style>
        <style>
            .github{

            }

                box-shadow: 0px 5px 5px rgba(0,0,0,0.15);

            }
        </style>
        <style>
            .bootstrap{
                margin-top:15px;
                background-color:rgb(121,82,179);
                color:white;
                padding-top:10px;

                padding-left:20px;

                margin-right:5px;

            }

        <style>

                color:rgb(108,117,125);

                border-radius:5px;

                padding-bottom:10px;
                padding-right:20px;
                padding-left:20px;
                font-family:Arial;
                font-weight:bold;
                font-size:14px;
                margin-right:5px;
                
            }
            .download:hover{
                background-color:rgb(108,117,125); 
                color:white;
            }

        </style>
        <style>
            .linkedln{

                font-weight:bold;



            }

            }
        </style>

            .Save{

                color:rgb(10,102,194);

                padding-bottom: 10px;
                border-radius:20px;
                border-color:rgb(10,102,194);

                font-size:16px;

        </button>

        <button class="github">

        </button>

        <button class="bootstrap">

        </button>

        </button>

        </button>
